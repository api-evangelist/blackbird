  - {name: Tag, object: user_tag, domain: member, description: Member metadata (public type industry identifies restaurant employees).}
  - {name: Membership, object: membership, domain: member, description: Member-to-restaurant membership record.}
  - {name: PaymentIntent, object: payment_intent, domain: payments, description: Payment from member to merchant in FLY.}
  - {name: AccountBalance, object: null, domain: payments, description: FLY-denominated balance referenced by payer/payee foreign keys on PaymentIntent; not fetchable directly.}
