notes: >-
  A typical member has two wallets (MEMBERSHIP + SPENDING), zero or more tags,
  check-ins, and memberships, a status record, and account balances that fund
  Payment Intents. Member-context resources live under /users/me/* — the subject
  is resolved from the OAuth token's sub claim, so no UUID appears in the path.
