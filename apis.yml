aid: blackbird
name: Blackbird
description: >-
  Blackbird Labs is the membership network for restaurant lovers, founded by
  Eater and Resy co-founder Ben Leventhal. Its consumer app lets diners earn
  status, perks, and points at world-class restaurants and pay their check in
  FLY, Blackbird's loyalty token. Blackbird's developer platform is the Flynet
  API — read access to the dining network (restaurants, locations, check-ins,
  member identity, and memberships) plus FLY Payment Intents modeled on Stripe —
  backed by an OpenAPI spec, first-party TypeScript SDKs (@flynetdev/core and
  @flynetdev/react), two MCP servers, a published agent skill, and llms.txt.
  Flynet is a layer-3 network built on Coinbase's Base chain. Backed by a16z,
  dcvc, and multicoin-capital.
