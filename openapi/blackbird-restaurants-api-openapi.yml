openapi: 3.2.0
info:
  title: Flynet App Restaurants API
  version: '1.0'
  description: 'Flynet''s partner API. Read access to member context, restaurants,

    locations, check-ins, and memberships; write access for payment

    intents.


    **Base URL:** staging `https://api.staging.blackbird.xyz/flynet/v1`.


    **Auth:** Two schemes — OAuth bearer (`Authorization: Bearer ...`) for

    member-scoped routes, API key (`X-API-Key`) for restaurant and

    location discovery. See Concepts → Authentication.


    **Pagination:** `page` is zero-indexed (default `0`); `page_size`

    default `50`. List responses include a `pagination` wrapper except

    `GET /locations/{id}/open_hours`.


    **Errors:** see Concepts → Pagination + errors. Three envelope shapes

    are documented there.

    '
servers:
- url: https://api.staging.blackbird.xyz/flynet/v1
  description: Staging
security:
- oauthBearer: []
tags:
- name: Restaurants
  description: Brand-level restaurant discovery.
paths:
  /restaurants:
    get:
      tags:
      - Restaurants
      summary: List restaurants
      operationId: listRestaurants
      description: Paginated list of restaurants.
      security:
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated restaurants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantList'
        '401':
          $ref: '#/components/responses/MissingApiKey'
  /restaurants/{id}:
    get:
      tags:
      - Restaurants
      summary: Get a restaurant
      operationId: getRestaurant
      description: Single restaurant by UUID.
      security:
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Restaurant found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/MissingApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
  /restaurants/{id}/locations:
    get:
      tags:
      - Restaurants
      summary: List a restaurant's locations
      operationId: listRestaurantLocations
      description: Paginated list of locations belonging to a restaurant.
      security:
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated locations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationList'
        '401':
          $ref: '#/components/responses/MissingApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    RestaurantId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 14339db3-2e7a-42c4-aa98-4c0fb18679eb
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 50
      description: Items per page. Default `50`.
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Zero-indexed page number.
  responses:
    MissingApiKey:
      description: 'Unauthorized. A **missing** `X-API-Key` returns an empty body with a `WWW-Authenticate: Bearer` header (read the header, not the body). An **invalid or revoked** key returns the JSON body below with `code: "invalid_api_key"`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: authentication_error
              code: invalid_api_key
              message: Invalid or revoked API key.
              param: null
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - type
          - code
          - message
          properties:
            type:
              type: string
            code:
              type: string
            message:
              type: string
            param:
              type:
              - string
              - 'null'
    Address:
      type: object
      properties:
        street:
          type: string
        street2:
          type:
          - string
          - 'null'
        city:
          type: string
        state:
          type: string
        zipcode:
          type: string
        country:
          type: string
    Neighborhood:
      type: object
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          enum:
          - neighborhood
        name:
          type: string
        region:
          type: string
    Location:
      type: object
      required:
      - id
      - object
      - restaurant
      - neighborhood
      - address
      - time_zone
      - payments_enabled
      - is_club
      - reservations_enabled
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          enum:
          - location
        name:
          type:
          - string
          - 'null'
        restaurant:
          $ref: '#/components/schemas/Restaurant'
        neighborhood:
          $ref: '#/components/schemas/Neighborhood'
        slug:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        coordinate:
          allOf:
          - $ref: '#/components/schemas/Coordinate'
        phone_number:
          type:
          - string
          - 'null'
        time_zone:
          type: string
        payments_enabled:
          type: boolean
        is_club:
          type: boolean
        reservations_enabled:
          type: boolean
        reservation_url:
          type:
          - string
          - 'null'
          format: uri
        google_place_id:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RestaurantList:
      type: object
      required:
      - restaurants
      - pagination
      properties:
        restaurants:
          type: array
          items:
            $ref: '#/components/schemas/Restaurant'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Restaurant:
      type: object
      required:
      - id
      - object
      - name
      - cuisine
      - cohort
      - tags
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          enum:
          - restaurant
        name:
          type: string
        cuisine:
          type: array
          items:
            type: string
        cohort:
          type:
          - string
          - 'null'
        price:
          type:
          - integer
          - 'null'
        tags:
          type: array
          items:
            type: object
            additionalProperties: true
        asset:
          type:
          - object
          - 'null'
          required:
          - preview_1x
          - web_2x
          - full_3x
          properties:
            preview_1x:
              type:
              - string
              - 'null'
              format: uri
            web_2x:
              type:
              - string
              - 'null'
              format: uri
            full_3x:
              type:
              - string
              - 'null'
              format: uri
        website_url:
          type:
          - string
          - 'null'
          format: uri
        instagram_url:
          type:
          - string
          - 'null'
          format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Pagination:
      type: object
      required:
      - total_count
      - total_pages
      - current_page
      - next_page
      - page_size
      properties:
        total_count:
          type: integer
        total_pages:
          type: integer
        current_page:
          type: integer
        next_page:
          type:
          - integer
          - 'null'
        page_size:
          type: integer
    Coordinate:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    LocationList:
      type: object
      required:
      - locations
      - pagination
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        pagination:
          $ref: '#/components/schemas/Pagination'
  securitySchemes:
    oauthBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'OAuth 2.0 access token. Required for the `/users/me/*` routes

        (profile, status, wallets, tags, check-ins, memberships) and all

        payment intent routes.

        '
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Server-to-server API key prefixed `fly_live_...` (production) or

        `fly_test_...` (staging/dev). Required on restaurant and location

        Discovery routes and on the `/check_ins` venue feed (key minted

        with `read:checkins`).

        '
