openapi: 3.2.0
info:
  title: Flynet Challenges API
  version: '1.0'
  description: Flynet's partner API.
servers:
- url: https://api.staging.blackbird.xyz/flynet/v1
  description: Staging
security:
- oauthBearer: []
tags:
- name: Challenges
paths:
  /challenges:
    get:
      tags:
      - Challenges
      summary: List challenges
      operationId: listChallenges
      description: 'Lists restaurant challenges — reward campaigns a member completes

        (by payment, referrals, dines, or passport milestones) to earn FLY.

        API-key auth only; requires the `read:restaurant_challenges` scope.'
      security:
      - apiKey: []
      parameters:
      - name: restaurant
        in: query
        required: true
        description: Restaurant UUID to list challenges for.
        schema:
          type: string
          format: uuid
        example: 14339db3-2e7a-42c4-aa98-4c0fb18679eb
      - name: location
        in: query
        required: false
        description: Optional location UUID to filter by.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of challenges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeList'
        '401':
          $ref: '#/components/responses/MissingApiKey'
        '403':
          description: Key lacks the `read:restaurant_challenges` scope. JSON `insufficient_scope` body with a `WWW-Authenticate` header.
components:
  schemas:
    Amount:
      type: object
      description: 'A monetary amount. `value` is a stringified integer in the smallest

        unit of `currency` (wei for FLY, cents for USD). Treat `value` as

        opaque — never parse it as a float. `currency` is the token or fiat

        symbol; its casing is not guaranteed stable across endpoints, so

        compare it case-insensitively.

        '
      required:
      - value
      - currency
      properties:
        value:
          type: string
          example: '1000000000000000000'
        currency:
          type: string
          example: FLY
    ChallengeList:
      type: object
      required:
      - challenges
      - pagination
      properties:
        challenges:
          type: array
          items:
            $ref: '#/components/schemas/Challenge'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Challenge:
      type: object
      required:
      - id
      - object
      - type
      - title
      - description
      - threshold
      - fly_reward
      - terms
      - accepted_currencies
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          example: challenge
        type:
          type: string
          enum:
          - PAYMENT
          - REFERRALS
          - DINES
          - PASSPORT
        title:
          type: string
        description:
          type: string
        image:
          type:
          - string
          - 'null'
        threshold:
          $ref: '#/components/schemas/ChallengeThreshold'
        fly_reward:
          $ref: '#/components/schemas/Amount'
        start_time:
          type:
          - string
          - 'null'
          format: date-time
        end_time:
          type:
          - string
          - 'null'
          format: date-time
        terms:
          type: array
          items:
            type: string
        accepted_currencies:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - type
          - code
          - message
          properties:
            type:
              type: string
            code:
              type: string
            message:
              type: string
            param:
              type:
              - string
              - 'null'
    Pagination:
      type: object
      required:
      - total_count
      - total_pages
      - current_page
      - next_page
      - page_size
      properties:
        total_count:
          type: integer
        total_pages:
          type: integer
        current_page:
          type: integer
        next_page:
          type:
          - integer
          - 'null'
        page_size:
          type: integer
    ChallengeThreshold:
      type: object
      description: 'Completion thresholds. Which fields are populated depends on the challenge `type`.

        '
      properties:
        spend_threshold:
          allOf:
          - $ref: '#/components/schemas/Amount'
        minimum_spend:
          allOf:
          - $ref: '#/components/schemas/Amount'
        dine_threshold:
          type:
          - integer
          - 'null'
        referral_threshold:
          type:
          - integer
          - 'null'
  parameters:
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 50
      description: Items per page. Default `50`.
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Zero-indexed page number.
  responses:
    MissingApiKey:
      description: 'Unauthorized. A **missing** `X-API-Key` returns an empty body with a `WWW-Authenticate: Bearer` header (read the header, not the body). An **invalid or revoked** key returns the JSON body below with `code: "invalid_api_key"`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: authentication_error
              code: invalid_api_key
              message: Invalid or revoked API key.
              param: null
  securitySchemes:
    oauthBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'OAuth 2.0 access token. Required for the `/users/me/*` routes

        (profile, status, wallets, tags, check-ins, memberships) and all

        payment intent routes.

        '
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Server-to-server API key prefixed `fly_live_...` (production) or

        `fly_test_...` (staging/dev). Required on restaurant and location

        Discovery routes and on the `/check_ins` venue feed (key minted

        with `read:checkins`).

        '
